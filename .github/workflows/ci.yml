name: CI
on:
  push:
  pull_request:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SupportAgentDemo.csproj --configuration Release
      - run: dotnet run --no-build --configuration Release --project SupportAgentDemo.csproj -- --self-test
